context:
  name: apache-airflow-providers-fab
  version: 3.8.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_fab-${{ version }}.tar.gz
  sha256: c29921b186a56f2cb3733d35ffc34690770d4fbada7f87893c0911af26c0e38b

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling ==1.32.0
    - packaging ==26.3
    - pathspec ==1.1.1
    - pluggy ==1.6.0
    # tightest of upstream's floors (python <3.11)
    # for all python to stay noarch: python
    - tomli ==2.4.1
    - tomlkit ==0.15.1
    - trove-classifiers ==2026.6.1.19
  run:
    - python >=${{ python_min }}
    - apache-airflow >=3.0.2
    - apache-airflow-providers-common-compat >=1.18.0
    - blinker >=1.6.2
    - flask >=2.2.1
    - flask-appbuilder ==5.2.2
    - pyjwt >=2.11.0
    # tightest of upstream's floors (python >=3.14)
    - flask-login >=0.6.3
    - flask-session >=0.8.0
    - msgpack-python >=1.0.0
    - flask-sqlalchemy >=3.0.5
    # tightest of upstream's floors (python >=3.14)
    - flask-wtf >=1.2.2
    - jmespath >=0.7.0
    # tightest of upstream's floors (python >=3.14)
    - werkzeug >=3.1.6
    - wtforms >=3.0
    - cachetools >=6.0
    - marshmallow >=3
    - flask-limiter >3
tests:
  - python:
      imports:
        - airflow.providers.fab
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-fab for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-fab/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
